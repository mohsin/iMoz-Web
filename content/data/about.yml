work:
- company: Tempestronics
  position: Full Stack Engineer
  duration: Jul 2014 - Present
  location: Bengaluru, India
  summary: "What started as a side business during university (building final-year projects for classmates) became a registered company right after college. Under the Tempestronics banner I design, build, and ship web, mobile, and AI applications for entrepreneurs, startups, and enterprises across India, the US, Australia, the UK, Singapore, Europe, and Latin America, with 50+ projects delivered end to end. The name roughly translates from Latin as 'the study of time', hence the gear logo (gears being what watches and clocks are engineered with)."
  summary_in_resume:
    - Founded and operated Tempestronics, delivering 50+ full-stack web, mobile, and AI applications for startups, agencies, and enterprise clients across India, the US, Australia, the UK, Singapore, Europe, and Latin America.
    - Built production AI/LLM systems including LangGraph-powered conversational agents with Google Gemini, deepfake detection microservices on Kubernetes with horizontal/vertical pod autoscaling, and voice-driven apps for Alexa and Google Home.
    - Architected AWS cloud infrastructure using Terraform, Docker, Auto Scaling, and spot instances; designed CI/CD pipelines with GitHub Actions; deployed scalable systems serving 50K+ users with 4.8 ratings.
    - Shipped production apps with Vue 3/Nuxt, React/Next.js, Laravel, OctoberCMS, WordPress (custom plugins), Android (Java/Kotlin), and iOS (Swift), backed by REST APIs and PostgreSQL/MySQL.
    - "Managed end-to-end delivery — requirements, architecture, Agile sprint planning, implementation, testing, deployment, and post-launch support."
