description: |
  Designed a prototype, got sign-off from the client, and then developed a powerful and stunning website for Blue Horn Inc. to showcase their company and gallery.

  Built on OctoberCMS with in-site editing capabilities. The design prototype (made in InVision) guided a pixel-accurate implementation of the final site.

  ## Modules

  - **Core Website**: OctoberCMS theme setup, page scaffolding, navigation, and favicon
  - **About Us Page**: profile section with photo, responsive layout, and mobile media queries
  - **Contact Form**: form component with email delivery integration
  - **Gallery**: custom MagnificGallery OctoberCMS plugin (`plugins/mohsin/magnificgallery`)
  - **Responsive Fixes**: mobile-first media queries across all pages including banner and contact sections
  - **Design Revisions**: multiple rounds of client-requested changes via WhatsApp briefs (Nov 2017)
