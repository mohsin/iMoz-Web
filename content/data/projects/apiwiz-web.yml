  Built the API catalog module for Itorix's APIWiz: a vendor-agnostic, low-code API lifecycle management platform trusted by regulated enterprises.

  ## API Catalog Module

  The catalog module enables customers to create, browse, and document APIs through an intuitive interface. Integrated an API runner directly in the browser so teams can test endpoints without leaving the platform. APIWiz manages the full API lifecycle from design through build, test, deploy, and monitor: supporting thousands of APIs across multiple gateways and service meshes.
